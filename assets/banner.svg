<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1328"/>
      <stop offset="1" stop-color="#0D2350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FA9FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3FA9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6FB8FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5CC4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5CC4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- name block -->
  <text x="72" y="92" fill="#5CC4FF" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">~/copenhagen $ claude</text>
  <text x="68" y="186" fill="#FFFFFF" font-size="96" font-weight="800" letter-spacing="-3">bali</text>
  <text x="72" y="236" fill="#C9D8F0" font-size="26" font-weight="500">building tools for Claude Code</text>
  <text x="72" y="272" fill="#7E93B8" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">vibe coding · agent memory · hackathons</text>
  <rect x="502" y="255" width="11" height="22" fill="#5CC4FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal card: a Claude Code session cycling through its steps -->
  <g transform="translate(600,44)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect width="330" height="232" rx="12" fill="#081022" stroke="#2A4A80" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#FF5F57"/><circle cx="38" cy="20" r="5" fill="#FEBC2E"/><circle cx="56" cy="20" r="5" fill="#28C840"/>
    <text x="78" y="25" fill="#7E93B8" font-size="12">dojo · session 1</text>
    <line x1="0" y1="40" x2="330" y2="40" stroke="#1B2C4F"/>
    <text x="18" y="66" fill="#7E93B8">$ claude</text>

    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
      <text x="18" y="96" fill="#28C840">✓ read CLAUDE.md</text>
      <text x="18" y="122" fill="#28C840">✓ loaded 6 topic files</text>
      <text x="18" y="148" fill="#5CC4FF">● editing README.md</text>
      <text x="18" y="174" fill="#7E93B8">  thinking<tspan>...<animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
      <text x="18" y="96" fill="#28C840">✓ 12 tests passed</text>
      <text x="18" y="122" fill="#28C840">✓ log.md updated</text>
      <text x="18" y="148" fill="#FEBC2E">? push to main  [y/n]</text>
      <text x="18" y="174" fill="#7E93B8">  waiting for you</text>
    </g>

    <!-- progress bar -->
    <rect x="18" y="200" width="294" height="6" rx="3" fill="#13213F"/>
    <rect x="18" y="200" width="0" height="6" rx="3" fill="#5CC4FF">
      <animate attributeName="width" values="0;294;294;0" keyTimes="0;0.45;0.95;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- session rail: several sessions, each with its own heartbeat -->
  <g transform="translate(960,44)" font-size="14">
    <g>
      <rect width="250" height="48" rx="10" fill="#0C1A36" stroke="#2A4A80"/>
      <circle cx="22" cy="24" r="6" fill="#28C840">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="29" fill="#E6EDF7" font-weight="600">dojo</text>
      <text x="234" y="29" fill="#7E93B8" font-size="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace">running</text>
    </g>
    <g transform="translate(0,62)">
      <rect width="250" height="48" rx="10" fill="#0C1A36" stroke="#2A4A80"/>
      <circle cx="22" cy="24" r="6" fill="#FEBC2E">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="29" fill="#E6EDF7" font-weight="600">brain-starter-kit</text>
      <text x="234" y="29" fill="#7E93B8" font-size="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace">needs you</text>
    </g>
    <g transform="translate(0,124)">
      <rect width="250" height="48" rx="10" fill="#0C1A36" stroke="#2A4A80"/>
      <circle cx="22" cy="24" r="6" fill="#5CC4FF">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.3s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="29" fill="#E6EDF7" font-weight="600">hackathon-build</text>
      <text x="234" y="29" fill="#7E93B8" font-size="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace">shipping</text>
    </g>
    <!-- data dots flowing from terminal into the rail -->
    <g>
      <line x1="0" y1="200" x2="250" y2="200" stroke="#1B2C4F" stroke-width="2"/>
      <circle r="3" fill="#5CC4FF" cy="200">
        <animate attributeName="cx" values="0;250" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#28C840" cy="200">
        <animate attributeName="cx" values="0;250" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#FEBC2E" cy="200">
        <animate attributeName="cx" values="0;250" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="0" y="228" fill="#7E93B8" font-size="12" font-family="ui-monospace, Menlo, monospace">3 sessions · 1 needs attention</text>
  </g>

  <!-- scanning sweep along the bottom -->
  <rect x="0" y="304" width="200" height="3" fill="url(#scan)">
    <animate attributeName="x" values="-200;1280" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
